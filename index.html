<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Anime Requester</title>

        <link rel="stylesheet" href="css/style.css">

        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>
    <body>
        <div class="form-content">
            <div class="flex justify-between w-full">
                <div>
                    <button id="setApiKeyBtn">API</button>
                </div>
                <h1>Anime Requester</h1>
                <div>
                    <button id="toggledarkModeBtn">Theme</button>
                </div>
            </div>

            <div class="form-container shadow">
                <div class="form-field">
                    <label for="filter">Choisissez un filtre</label>
                    <select id="filter">
                        <option value="byTitle">Recherche par titre</option>
                        <option value="byId">Recherche par ID</option>
                        <option value="byRang">Recherche par rang</option>
                        <option value="byGenre">Recherche par genre</option>
                    </select>
                </div>

                <div class="form-field" id="paramField">
                    <label for="parameter">
                        Entrez le paramètre
                    </label>
                    <input type="text" id="parameter" placeholder="Ex: Naruto">
                </div>

                <div class="checkbox-group mt-7" id="checkboxGroup" style="display: none;"></div>

                <div style="display: flex; align-items: center; margin: 24px 0;">
                    <hr style="flex: 1; border: none; border-top: 1px solid #ccc;">
                    <button id="toggleMoreFilter">
                        Afficher les filtres avancés
                    </button>
                    <hr style="flex: 1; border: none; border-top: 1px solid #ccc;">
                </div>  


                
                <div class="more-filter justify-center" id="moreFilter" style="display: none; transition: .3s;">
                    <div class="radio-group me-4" id="sortGroup">
                        <label class="radio-label me-3" for="filter"><b>Classer par :</b></label>
                        <div class="filterRow">
                            <div class="flex items-center gap-1">
                                <input checked value="ranking" class="" type="radio" name="sort" id="rang">
                                <label for="rang">Rang</label>
                            </div>
                            <div class="flex items-center gap-1">
                                <input value="name"  class="" type="radio" name="sort" id="nom">
                                <label for="nom">Nom</label>
                            </div>
                        </div>
                    </div>
                    <div class="radio-group" id="sortByGroup">
                        <label class="radio-label me-3" for="filter"><b>Ordre :</b></label>
                        <div class="filterRow">
                            <div class="flex items-center gap-1">
                                <input value="asc" checked class="" type="radio" name="sortBy" id="asc">
                                <label for="asc">Croissant</label>
                            </div>
                            <div class="flex items-center gap-1">
                                <input value="desc" class="" type="radio" name="sortBy" id="desc">
                                <label for="desc">Décroissant</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-field">
                    <div class="form-buttons">
                        <button id="searchBtn">Rechercher</button>
                        <button id="clearBtn">Réinitialiser</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="card-container" class="card-container"></div>

        <script defer src="js/api.js"></script>
        <script defer src="js/request.js"></script>
        <script defer src="js/search.js"></script>
        <script defer src="js/cards.js"></script>
    </body>
</html>
